  <circle cx="186" cy="40" r="16" fill="#FFB81C"/>
  <!-- steam -->
  <g fill="none" stroke="#C8C6E0" stroke-width="5" stroke-linecap="round">
    <path d="M98 44c-8 10 8 16 0 26"/>
    <path d="M120 36c-8 10 8 16 0 26"/>
    <path d="M142 44c-8 10 8 16 0 26"/>
  </g>
  <!-- plate -->
